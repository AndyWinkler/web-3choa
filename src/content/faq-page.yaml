heroHeadline: Frequently asked questions
heroSubline: Common questions about HOA management, our services, and working with 3c HOA Management.
questions:
  - question: What does an HOA management company do?
    answer: >-
      An HOA management company handles the day-to-day operations of your
      community association — including board meetings, financial management,
      vendor coordination, compliance enforcement, and homeowner communications.
      We serve as the operational backbone so your board can focus on governance
      and community goals.
  - question: How is 3c HOA Management different from other management companies?
    answer: >-
      We emphasize transparency, personalized service, and genuine community
      investment. We don't take a one-size-fits-all approach — we build a
      management plan specific to your community's size, needs, and goals. Our
      team is accessible, responsive, and treats every community as if it were
      our own.
  - question: What areas do you serve?
    answer: >-
      We primarily serve communities in Utah, with a focus on the greater Salt
      Lake City and Park City areas. Contact us to confirm service availability
      for your community.
  - question: How do homeowners access their portal?
    answer: >-
      Homeowners can log in at app.buildinglink.com using the credentials
      provided by their HOA. The portal provides access to community documents,
      payment history, maintenance request submission, and community announcements.
  - question: What is an Owner's Representative and do I need one?
    answer: >-
      An Owner's Representative manages capital improvement projects on behalf
      of your HOA — coordinating contractors, overseeing budgets, and ensuring
      projects are completed on time and on budget. If your community is planning
      major repairs, renovations, or construction, an Owner's Rep protects your
      investment.
  - question: How do I get started with 3c HOA Management?
    answer: >-
      Simply reach out through our contact form or call us at (435) 250-4150.
      We'll schedule a consultation to understand your community's needs and put
      together a tailored proposal — with no commitment required for the initial
      conversation.
stillQuestionsHeading: Still have questions?
stillQuestionsBody: We're happy to talk through your specific situation.
