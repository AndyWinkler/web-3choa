heroHeadline: Straight Answers to Tough HOA Questions.
heroSubline: >-
  We know that changing management companies is a big decision. Here are honest
  answers to the most common questions we hear from boards looking for relief.
questions:
  - question: >-
      Our current financials are a complete disaster. Are we too far gone for
      you to help?
    answer: >-
      Absolutely not; in fact, this is one of our specialties. We frequently
      step into situations with neglected, chaotic, or completely missing
      financial records left behind by a previous provider. Our first step is to
      perform a forensic review to untangle the mess, reconstruct the data, and
      build a clean, transparent baseline so your board finally knows exactly
      where every dollar is.
  - question: >-
      We are deeply unhappy with our current manager, but we're dreading the
      transition process. How hard is it to switch to 3c HOA?
    answer: >
      We know that "transition dread" keeps many boards stuck in bad contracts.
      That’s why we take the heavy lifting completely off your plate. We handle
      the entire handover—coordinating with your outgoing company to secure all
      legal documents, bank accounts, ledgers, and vendor contracts. We make the
      shift seamless so your board experiences immediate relief, not more work.
  - question: >-
      We have a massive roof replacement coming up. Can't a standard property
      manager handle that?
    answer: >
      Standard property management covers routine day-to-day operations, not
      complex construction oversight. Multi-million dollar capital projects
      require specialized expertise to prevent contractor overbilling,
      aggressively audit funds, and ensure quality control. As your dedicated
      Owner’s Representative, we step in as your fierce advocate on these
      large-scale projects—a level of protection most standard management
      companies simply cannot provide.
  - question: ' Our current manager takes days to return emails and only calls when someone is angry. How is your approach different?'
    answer: >
      Poor communication is the number one complaint in the HOA industry,
      usually caused by national conglomerates overloading their managers.
      Because we are an independent, local company, we intentionally manage our
      portfolio sizes so we can actually answer the phone. Our commitment is
      proactive, crystal-clear communication. We don't just react to broken
      pipes; we proactively manage your community to prevent them.
  - question: >-
      We are a newer community still partially controlled by the developer. When
      should we bring you in?
    answer: >-
      Before the handover is complete. We act as your independent auditor during
      the transition to ensure the developer leaves you with a complete
      operational framework, fully funded initial reserves, and no hidden
      liabilities. Waiting until after the developer leaves often results in the
      homeowners footing the bill for unfinished infrastructure.
  - question: How do homeowners access their portal?
    answer: >-
      Homeowners can log in at https://www.app.allhoa.com/3choa using the
      credentials provided by their HOA. The portal provides access to community
      documents, payment history, maintenance request submission, and community
      announcements.
  - question: How do I get started with 3c HOA Management?
    answer: >-
      Reach out to us through our contact form or give us a call at (435)
      250-4150. We know boards are busy, so we keep the process simple. We’ll
      schedule a brief, no-commitment chat to understand your community’s unique
      needs, provide a custom management proposal, and take all the heavy
      lifting off your shoulders from day one.
  - question: '💡 Board Insight: The "Value" Question'
    answer: >
      Are you paying a management fee just for someone to pay the bills, or are
      you paying for proactive asset protection? If your current management
      company only reacts to emergencies and homeowner complaints, you are
      leaving the long-term health and property value of your community to
      chance. It's time to expect more.
stillQuestionsHeading: Still have questions?
stillQuestionsBody: We're happy to talk through your specific situation.
