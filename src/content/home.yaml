heroHeadline: Community · Care · Connect
heroSubline: >-
  Tired of managing your management company? We provide proactive, customized
  HOA management that restores financial health, protects property values, and
  gives your board its time back.
heroCta: Get Started
heroPortalLabel: Homeowner Portal
whyHeadline: Why 3c HOA Management?
whyBody: >-
  Your community isn't just a line item on a corporate spreadsheet. We combine
  over a decade of deep Utah HOA expertise with proactive, hands-on care. Our
  goal is simple: eliminate board burnout, resolve lingering issues, and protect
  your most valuable investment.
whyBullets:
  - '100% Transparent Financials: Never guess where your reserve funds stand.'
  - >-
    Tailored, Hands-On Management: Solutions built for your specific community's
    size, not a one-size-fits-all template.
  - >-
    Local Utah Expertise: We know local vendor networks, compliance laws, and
    weather-related maintenance inside and out.
  - Modern owner portal for payments, requests, and documents
  - >-
    Preventative Maintenance: We fix small issues before they become expensive
    emergency special assessments.
testimonialsHeadline: Testimonials
testimonialsSubline: 'Board Memebers, Owners and Vendors about working with 3c HOA:'
testimonials:
  - quote: >-
      "As an HOA board member navigating the transition away from our previous
      property management company, I couldn't have asked for a better partner
      than 3c HOA Management. If you're thinking about making a change, trust
      your gut and make the move! Cari Cutler and her team has made the entire
      transition seamless, providing clear communication, thorough guidance, and
      confidence every step of the way. Cari has already proven to be a strong
      advocate, and I'm excited to see how her leadership and expertise will
      help our community thrive for years to come.” 
    name: A.Keller
  - quote: >-
      Working with them as a vendor is great. They are easy to talk to and their
      process is simple. Plus, they pay their invoices quickly via direct
      deposit, which makes my job a lot easier.
    name: Janitorial Services
ctaHeadline: Ready to elevate your community?
ctaSubline: Let's talk about your community's unique needs.
